<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ask BusyAI - BrainBuddy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <!-- BrainBuddy Theme Support -->
    <script>(function(){try{var t=localStorage.getItem('brainbuddy-theme');if(t==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}})();</script>
    <link rel="stylesheet" href="/static/theme.css">
    <script src="/static/theme.js" defer></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
    <nav class="bg-slate-900 border-b border-slate-700">
        <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="/dashboard" class="text-blue-400 font-bold text-xl">BrainBuddy</a>
            <a href="/dashboard" class="text-slate-300 hover:text-white">← Back to Dashboard</a>
        </div>
    </nav>

    <div class="max-w-5xl mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-white mb-2">Ask BusyAI</h1>
        <p class="text-slate-400 mb-8">Chat with your notes · {{ material.title }}</p>

        {% if error %}
        <div class="bg-red-900/40 border border-red-500 text-red-200 px-4 py-3 rounded-lg mb-4 text-sm">
            {{ error }}
        </div>
        {% endif %}

        <form action="/ask/{{ material.id }}" method="POST"
              class="bg-slate-900 border border-slate-700 rounded-2xl p-6 shadow-xl mb-6">
            <label class="block text-slate-300 font-medium mb-2">Your Question</label>
            <textarea name="question" rows="4" required
                class="w-full px-4 py-3 rounded-lg bg-slate-800 border border-slate-600 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-purple-500"
                placeholder="e.g. What is virtual memory? Explain with points.">{{ question or '' }}</textarea>

            <button type="submit"
                class="mt-4 bg-purple-600 hover:bg-purple-500 text-white font-bold px-6 py-2.5 rounded-lg transition">
                Get Answer
            </button>
        </form>

        {% if question and answer %}
        <div class="space-y-4">
            <div class="bg-slate-900 border border-slate-700 rounded-2xl p-5">
                <p class="text-xs uppercase tracking-wide text-slate-400 mb-2">You asked</p>
                <p class="text-white font-medium">{{ question }}</p>
            </div>

            <div class="bg-slate-900 border border-purple-700 rounded-2xl p-6 shadow-xl">
                <div class="flex items-center gap-2 mb-3">
                    <div class="w-2.5 h-2.5 rounded-full bg-purple-400"></div>
                    <h2 class="text-lg font-bold text-purple-400">BusyAI Answer</h2>
                </div>
                <div class="text-slate-200 leading-relaxed whitespace-pre-wrap">{{ answer }}</div>
            </div>
        </div>
        {% endif %}

        <div class="flex flex-wrap gap-3 mt-8">
            <a href="/summary/{{ material.id }}" class="bg-blue-700 hover:bg-blue-600 px-4 py-2 rounded-lg text-sm font-medium">Summary</a>
            <a href="/concepts/{{ material.id }}" class="bg-indigo-700 hover:bg-indigo-600 px-4 py-2 rounded-lg text-sm font-medium">Concepts</a>
            <a href="/flashcards/{{ material.id }}" class="bg-yellow-700 hover:bg-yellow-600 px-4 py-2 rounded-lg text-sm font-medium">Flashcards</a>
            <a href="/quiz/{{ material.id }}" class="bg-green-700 hover:bg-green-600 px-4 py-2 rounded-lg text-sm font-medium">Quiz</a>
        </div>
    </div>
</body>
</html>
