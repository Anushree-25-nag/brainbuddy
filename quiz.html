<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - BrainBuddy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <!-- BrainBuddy Theme Support -->
    <script>(function(){try{var t=localStorage.getItem('brainbuddy-theme');if(t==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}})();</script>
    <link rel="stylesheet" href="/static/theme.css">
    <script src="/static/theme.js" defer></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
    <nav class="bg-slate-900 border-b border-slate-700">
        <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="/dashboard" class="text-blue-400 font-bold text-xl">BrainBuddy</a>
            <a href="/dashboard" class="text-slate-300 hover:text-white">← Back to Dashboard</a>
        </div>
    </nav>

    <div class="max-w-5xl mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-white mb-2">Quiz</h1>
        <p class="text-slate-400 mb-8">{{ material.title }}</p>

        <form action="/quiz/{{ material.id }}/submit" method="POST" class="space-y-6">
            {% for q in quiz %}
            <div class="bg-slate-900 border border-slate-700 rounded-2xl p-6 shadow-lg">
                <div class="flex justify-between items-start mb-3">
                    <h3 class="text-lg font-semibold text-white">Q{{ loop.index }}. {{ q.question }}</h3>
                    <span class="text-xs bg-slate-800 text-slate-300 px-2 py-1 rounded border border-slate-600">{{ q.topic }}</span>
                </div>

                <input type="hidden" name="correct_{{ q.id }}" value="{{ q.correct_index }}">
                <input type="hidden" name="topic_{{ q.id }}" value="{{ q.topic }}">

                <div class="space-y-2 mt-4">
                    {% for opt in q.options %}
                    <label class="flex items-start gap-3 p-3 rounded-lg bg-slate-800 border border-slate-700 hover:border-blue-500 cursor-pointer">
                        <input type="radio" name="question_{{ q.id }}" value="{{ loop.index0 }}" required class="mt-1">
                        <span class="text-slate-200">{{ opt }}</span>
                    </label>
                    {% endfor %}
                </div>
            </div>
            {% endfor %}

            <button type="submit"
                class="w-full md:w-auto bg-green-600 hover:bg-green-500 text-white font-bold px-8 py-3 rounded-lg transition">
                Submit Quiz
            </button>
        </form>
    </div>
</body>
</html>
