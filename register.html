<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrainBuddy - Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
    <!-- BrainBuddy Theme Support -->
    <script>(function(){try{var t=localStorage.getItem('brainbuddy-theme');if(t==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}})();</script>
    <link rel="stylesheet" href="/static/theme.css">
    <script src="/static/theme.js" defer></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col justify-between">

    <!-- Navbar Header -->
    <header class="p-6 border-b border-gray-800">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center font-bold text-xl text-white shadow-lg shadow-indigo-500/30">
                    BB
                </div>
                <span class="text-xl font-bold tracking-tight text-white">BrainBuddy</span>
            </div>
            <span class="text-xs text-gray-400 bg-gray-800 px-3 py-1.5 rounded-full border border-gray-700">
                GIET University BCA Portal
            </span>
        </div>
    </header>

    <!-- Registration Form Card -->
    <main class="flex items-center justify-center px-4 py-12">
        <div class="bg-gray-800/90 border border-gray-700/80 p-8 rounded-2xl shadow-2xl w-full max-w-md backdrop-blur-md">
            
            <div class="text-center mb-6">
                <h2 class="text-2xl font-bold text-white tracking-tight">Create Account</h2>
                <p class="text-gray-400 text-sm mt-1">Register using your college credentials</p>
            </div>

            <!-- Error Feedback Alert -->
            {% if error %}
            <div class="mb-5 p-3.5 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-sm flex items-center space-x-2">
                <svg class="w-5 h-5 text-red-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form action="/register" method="POST" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-300 uppercase tracking-wider mb-2">Full Name</label>
                    <input type="text" name="name" value="{{ name if name else '' }}" required autofocus
                           placeholder="Rahul Sharma"
                           class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-300 uppercase tracking-wider mb-2">College Email ID</label>
                    <input type="email" name="email" value="{{ email if email else '' }}" required
                           placeholder="rahul.bca@giet.edu"
                           class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-300 uppercase tracking-wider mb-2">Password</label>
                    <input type="password" name="password" required
                           placeholder="••••••••"
                           class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500">
                </div>

                <button type="submit"
                        class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl transition duration-150 shadow-lg shadow-indigo-600/30 mt-2">
                    Register Account
                </button>
            </form>

            <div class="mt-6 text-center pt-6 border-t border-gray-700/60">
                <p class="text-sm text-gray-400">
                    Already registered? 
                    <a href="/login" class="text-indigo-400 hover:text-indigo-300 font-semibold transition">Sign in here</a>
                </p>
            </div>

        </div>
    </main>

    <footer class="p-6 text-center text-xs text-gray-500 border-t border-gray-800">
        BrainBuddy Academic Platform &bull; GIET University Odisha
    </footer>

</body>
</html>
