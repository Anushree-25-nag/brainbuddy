<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revision Guide - BrainBuddy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <!-- BrainBuddy Theme Support -->
    <script>(function(){try{var t=localStorage.getItem('brainbuddy-theme');if(t==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}})();</script>
    <link rel="stylesheet" href="/static/theme.css">
    <script src="/static/theme.js" defer></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
    <nav class="bg-slate-900 border-b border-slate-700">
        <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="/dashboard" class="text-blue-400 font-bold text-xl">BrainBuddy</a>
            <a href="/dashboard" class="text-slate-300 hover:text-white">← Back to Dashboard</a>
        </div>
    </nav>

    <div class="max-w-5xl mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-white mb-2">Revision Guide</h1>
        <p class="text-slate-400 mb-6">{{ material.title }}</p>

        {% if weak_topics %}
        <div class="flex flex-wrap gap-2 mb-6">
            {% for wt in weak_topics %}
            <span class="bg-pink-900/50 text-pink-300 border border-pink-700 px-3 py-1 rounded-full text-sm">{{ wt.topic }} · {{ wt.status }}</span>
            {% endfor %}
        </div>
        {% endif %}

        <div class="bg-slate-900 border border-slate-700 rounded-2xl p-6 shadow-xl">
            <div class="text-slate-200 leading-relaxed whitespace-pre-wrap">{{ guide }}</div>
        </div>
    </div>
</body>
</html>
