<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summary - BrainBuddy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <!-- BrainBuddy Theme Support -->
    <script>(function(){try{var t=localStorage.getItem('brainbuddy-theme');if(t==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}})();</script>
    <link rel="stylesheet" href="/static/theme.css">
    <script src="/static/theme.js" defer></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
    <nav class="bg-slate-900 border-b border-slate-700">
        <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="/dashboard" class="text-blue-400 font-bold text-xl">BrainBuddy</a>
            <a href="/dashboard" class="text-slate-300 hover:text-white">← Back to Dashboard</a>
        </div>
    </nav>

    <div class="max-w-5xl mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-white mb-2">Summary</h1>
        <p class="text-slate-400 mb-8">{{ material.title }}</p>

        <div class="bg-slate-900 border border-slate-700 rounded-2xl p-6 mb-6 shadow-xl">
            <h2 class="text-xl font-bold text-blue-400 mb-3">Overview</h2>
            <p class="text-slate-200 leading-relaxed">{{ summary.overview }}</p>
        </div>

        <div class="bg-slate-900 border border-slate-700 rounded-2xl p-6 shadow-xl">
            <h2 class="text-xl font-bold text-blue-400 mb-4">Key Points</h2>
            <ul class="space-y-3">
                {% for point in summary.key_points %}
                <li class="flex gap-3 items-start">
                    <span class="text-blue-400 mt-1">●</span>
                    <span class="text-slate-200">{{ point }}</span>
                </li>
                {% endfor %}
            </ul>
        </div>

        <div class="flex flex-wrap gap-3 mt-8">
            <a href="/concepts/{{ material.id }}" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-lg font-medium">Concepts</a>
            <a href="/flashcards/{{ material.id }}" class="bg-yellow-600 hover:bg-yellow-500 px-4 py-2 rounded-lg font-medium">Flashcards</a>
            <a href="/quiz/{{ material.id }}" class="bg-green-600 hover:bg-green-500 px-4 py-2 rounded-lg font-medium">Quiz</a>
            <a href="/ask/{{ material.id }}" class="bg-purple-600 hover:bg-purple-500 px-4 py-2 rounded-lg font-medium">Ask BusyAI</a>
        </div>
    </div>
</body>
</html>
